name: Harness tests

permissions:
  contents: read

on:
  push:
    branches: [dev, main]
  pull_request:

# A newer push to the same pull request makes the running suite moot; runs on dev and main always finish.
concurrency:
  group: harness-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alk
          POSTGRES_PASSWORD: alk
          POSTGRES_DB: alk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra livekit --extra harness-stores --extra harness-ui --extra hosted-tracing
      - name: Run harness tests
        env:
          ALK_TEST_POSTGRES_DSN: postgresql://alk:alk@localhost:5432/alk
        # The Claude Agent SDK reference test needs the SDK version its example pins; sdk-smoke installs it and
        # runs that file.
        run: >-
          uv run pytest -q -p no:cacheprovider -rs tests/test_harness.py tests/harness
          --ignore=tests/harness/test_claude_agent_sdk_reference.py
