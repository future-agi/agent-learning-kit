name: E2B template

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/e2b-template.yml
      - scripts/e2b-template.py
      - Dockerfile.hosted
      - .dockerignore
      - hosted-snapshot/**
      - pyproject.toml
      - src/**

permissions:
  contents: read

# Distinct commits get distinct templates; never discard a merge's publication.
# Serialize reruns of the same commit and let sandbox cleanup finish.
concurrency:
  group: e2b-template-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.9"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publisher inputs without credentials
        run: python3 scripts/e2b-template.py --dry-run

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required credentials
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [[ -z "$E2B_API_KEY" ]]; then
            echo "::error::Add the E2B_API_KEY repository secret to publish templates."
            exit 1
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, publish, and certify
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          # E2B's builder must also authenticate to pull the private GHCR image.
          E2B_REGISTRY_USERNAME: ${{ github.actor }}
          E2B_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run --python 3.12 scripts/e2b-template.py \
            --image-repository "ghcr.io/${GITHUB_REPOSITORY,,}/alk-hosted-runtime" \
            --image-tag "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-name "alk-hosted-${GITHUB_SHA:0:12}" \
            --output dist/e2b-template-release.json
      - name: Summarize certified release
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("dist/e2b-template-release.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Certified E2B template\n\n")
              for label, key in (
                  ("ALK commit", "alk_source_revision"),
                  ("Image", "image_reference"),
                  ("Template reference", "template_reference"),
                  ("CPU", "cpu_count"),
                  ("Memory (MB)", "memory_mb"),
                  ("Verified disk (GB)", "verified_disk_gb"),
              ):
                  summary.write(f"- {label}: `{release[key]}`\n")
              summary.write("\nCertification checks:\n\n")
              for check in release["certification_checks"]:
                  summary.write(f"- {check}\n")
              summary.write(
                  "\nDownload the release artifact for the immutable template reference "
                  "and full certification metadata.\n"
              )
          PY
      - name: Save certified release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2b-template-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/e2b-template-release.json
          if-no-files-found: error
          retention-days: 90
