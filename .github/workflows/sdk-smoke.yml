name: SDK smoke

# Least-privilege token: install + test only.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run doctor
        run: agent-learn doctor --quiet
      - name: Run local text simulation
        env:
          AGENT_LEARNING_RUN_EXAMPLE_KEY: smoke
        run: >-
          agent-learn simulation run examples/run_manifest.json
          --output smoke-report.json --quiet
      - name: Verify simulation report
        run: >-
          python -c "import json, pathlib;
          report=json.loads(pathlib.Path('smoke-report.json').read_text());
          assert report['status'] == 'ran' and report['report']['results']"
      - name: Install test dependencies
        # Exercise the minimum LiveKit version supported by pyproject.toml.
        run: >-
          python -m pip install '.[livekit]' pytest pytest-asyncio
          'livekit-agents==1.8.3'
          'livekit-plugins-cartesia==1.8.3'
          'livekit-plugins-deepgram==1.8.3'
          'livekit-plugins-elevenlabs==1.8.3'
          'livekit-plugins-google==1.8.3'
          'livekit-plugins-openai==1.8.3'
          'livekit-plugins-silero==1.8.3'
      - name: Run engine + dispatch + acceptance tests
        # Scoped to the suites this PR adds/relies on. The broader tests/ tree has
        # pre-existing failures unrelated to the voice engine (CLI golden-path,
        # init presets, plus test_config_and_facades hangs) — track those
        # separately so this gate stays green and meaningful.
        run: >-
          python -m pytest -q
          tests/runtime/test_livekit_engine.py
          tests/runtime/test_manifest_engine_dispatch.py
          tests/test_acceptance_regressions.py
          tests/runtime/test_voice_environment.py
          tests/test_retell_endpoint.py
          tests/test_retell_transport_validation.py
          tests/test_call_originator_factory.py
          tests/test_retell_evidence.py
          tests/harness/test_process_runtime.py
          tests/harness/test_simulation_mark_bootstrap.py
          tests/harness/test_process_preflight.py
          tests/harness/test_spend.py
          tests/harness/test_claude_cost.py
          tests/providers
          tests/harness/test_scenario_source_provision_agent.py
          tests/harness/test_hosted_entrypoint_provision_retry.py
          tests/harness/test_instrumentation_evidence.py
          tests/harness/test_agent_type_refusal.py
          tests/harness/test_executor_completed_counts.py
          tests/test_bump_deployment_values.py
          tests/test_release_workflow.py
          tests/test_release_pr_step.py
          tests/episode
      - name: Rerun the Claude cost tests on the locked SDK
        # The hosted image installs from uv.lock, while the step above gets pip's newest SDK. The
        # two handle a resumed session differently (TH-9057), so the cost tests run on both.
        run: |
          version=$(python -c "import tomllib; lock = tomllib.load(open('uv.lock', 'rb')); print(next(p['version'] for p in lock['package'] if p['name'] == 'claude-agent-sdk'))")
          python -m pip install "claude-agent-sdk==$version"
          python -m pytest -q tests/harness/test_claude_cost.py
