name: SDK smoke

# Least-privilege token: install + test only.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  openai-agents-sdk:
    # The kit's hook against the real OpenAI Agents SDK, pinned to the version its internals were
    # read at. A third-party package for this job only: the main install and clean-install jobs
    # are unchanged.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The version the hook's exporter handling was read against, and the newest that installs
        # beside the kit: 0.21.0 and later need openai>=3, and the kit pins openai<3.
        openai-agents: ["0.18.3", "0.20.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the kit with the pinned OpenAI Agents SDK
        run: python -m pip install . pytest 'openai-agents==${{ matrix.openai-agents }}'
      - name: Run the hook's real-SDK tests, failing if they skip
        shell: bash
        run: |
          python -m pytest -q -rs tests/harness/test_python_tool_trace_bootstrap.py \
            -k real_openai_agents_sdk | tee pytest.out
          ! grep -q "skipped" pytest.out

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run doctor
        run: agent-learn doctor --quiet
      - name: Run local text simulation
        env:
          AGENT_LEARNING_RUN_EXAMPLE_KEY: smoke
        run: >-
          agent-learn simulation run examples/run_manifest.json
          --output smoke-report.json --quiet
      - name: Verify simulation report
        run: >-
          python -c "import json, pathlib;
          report=json.loads(pathlib.Path('smoke-report.json').read_text());
          assert report['status'] == 'ran' and report['report']['results']"
      - name: Install test dependencies
        # Exercise the minimum LiveKit version supported by pyproject.toml.
        run: >-
          python -m pip install '.[livekit]' pytest pytest-asyncio 'hypothesis>=6.140'
          'livekit-agents==1.8.3'
          'livekit-plugins-cartesia==1.8.3'
          'livekit-plugins-deepgram==1.8.3'
          'livekit-plugins-elevenlabs==1.8.3'
          'livekit-plugins-google==1.8.3'
          'livekit-plugins-openai==1.8.3'
          'livekit-plugins-silero==1.8.3'
      - name: Pin the Claude Agent SDK to the lock's version
        # The image installs the SDK at uv.lock's version, so the tests run the Claude Code CLI
        # that ships (test_secret_paths.py drives it; TH-9042). Only the SDK is pinned here.
        run: >-
          python -m pip install "claude-agent-sdk==$(python -c "import tomllib;
          print(next(p['version'] for p in tomllib.load(open('uv.lock', 'rb'))['package']
          if p['name'] == 'claude-agent-sdk'))")"
      - name: Run engine + dispatch + acceptance tests
        # Scoped to the suites this PR adds/relies on. The broader tests/ tree has
        # pre-existing failures unrelated to the voice engine (CLI golden-path,
        # init presets, plus test_config_and_facades hangs) — track those
        # separately so this gate stays green and meaningful.
        # Deselected below, failing on dev too: the two sandbox-server tests are TH-8978, and the
        # six in tests/test_harness.py fail on dev 70fc43bd as they do here (recorded in the
        # older-findings register). (The run is one folded line, so they are named here rather
        # than beside each --deselect.)
        run: >-
          python -m pytest -q
          tests/runtime/test_livekit_engine.py
          tests/runtime/test_manifest_engine_dispatch.py
          tests/test_acceptance_regressions.py
          tests/runtime/test_voice_environment.py
          tests/test_retell_endpoint.py
          tests/test_retell_transport_validation.py
          tests/test_call_originator_factory.py
          tests/test_retell_evidence.py
          tests/harness/test_process_runtime.py
          tests/harness/test_source_folder.py
          tests/test_harness_sandbox_server.py
          --deselect tests/test_harness_sandbox_server.py::test_private_github_submission_becomes_hosted_job
          --deselect tests/test_harness_sandbox_server.py::test_public_github_branch_url_populates_job_ref
          tests/test_harness_architecture.py
          tests/test_harness_credentials.py
          tests/test_harness_secrets.py
          tests/test_harness.py
          --deselect tests/test_harness.py::test_hosted_claude_session_uses_durable_resume_and_restricted_tools
          --deselect tests/test_harness.py::test_a_skill_only_names_tools_its_stage_actually_has
          --deselect tests/test_harness.py::test_connect_only_provider_world_cannot_create_shadow_state
          --deselect tests/test_harness.py::test_the_system_prompt_stays_within_budget
          --deselect tests/test_harness.py::test_a_save_refused_for_the_suites_shape_is_accepted_on_the_second_try
          --deselect tests/test_harness.py::test_dropping_every_scenario_needs_an_explicit_everything
          tests/harness/test_contract_model.py
          tests/harness/test_contract_writer.py
          tests/harness/test_runtime_repair.py
          tests/harness/test_runtime_selection_admission.py
          tests/harness/test_nudge_turn.py
          tests/harness/test_seed_rows.py
          tests/harness/test_builder_chat.py
          tests/harness/test_hosted_conversation.py
          tests/harness/test_source_tool_evidence.py
          tests/harness/test_source_directory_names.py
          tests/harness/test_storage_decision_admission.py
          tests/harness/test_authoring_runtime_validation.py
          tests/harness/test_failure_file.py
          tests/harness/test_contract_tools_subfolder.py
          tests/harness/test_contract_model.py
          tests/harness/test_secret_paths.py
          tests/harness/test_import_roots.py
          tests/harness/test_source_data_invariants_folder.py
          tests/harness/test_hosted_authoring_entrypoint.py
          tests/harness/test_certify_only.py
          tests/harness/test_bundle_author_v2.py
          tests/harness/test_python_tool_trace_bootstrap.py
          tests/harness/test_workflow_intent.py
          tests/harness/test_simulation_mark_bootstrap.py
          tests/harness/test_process_preflight.py
          tests/harness/test_process_diagnostics.py
          tests/harness/test_spend.py
          tests/harness/test_claude_cost.py
          tests/providers
          tests/harness/test_observability.py
          tests/harness/test_scenario_source_provision_agent.py
          tests/harness/test_framework_detection.py
          tests/harness/test_openai_agents_reference.py
          tests/harness/test_hosted_entrypoint.py
          tests/harness/test_hosted_entrypoint_provision_retry.py
          tests/harness/test_pydantic_ai_reference.py
          tests/harness/test_instrumentation_evidence.py
          tests/harness/test_agent_type_refusal.py
          tests/harness/test_google_adk_reference.py
          tests/harness/test_python_source_codecs.py
          tests/harness/test_executor_completed_counts.py
          tests/harness/test_deep_agents_reference.py
          tests/harness/test_langgraph_http_adapter.py
          tests/harness/test_reading_entry.py
          tests/harness/test_agent_reading.py
          tests/harness/test_crewai_reference.py
          tests/harness/test_scan_walk.py
          tests/harness/test_browser_scan_cut.py
          tests/harness/test_import_lines.py
          tests/harness/test_import_lines_diff.py
          tests/harness/test_scan_folders.py
          tests/harness/test_scan_document.py
          tests/harness/test_scan_ai.py
          tests/harness/test_agent_scan.py
          tests/harness/test_authoring_entrypoint_find_agents.py
          tests/harness/test_seed_contract.py
          tests/test_bump_deployment_values.py
          tests/test_release_workflow.py
          tests/test_release_pr_step.py
          tests/episode
      - name: Rerun the Claude cost tests on the locked SDK
        # The hosted image installs from uv.lock, while the step above gets pip's newest SDK. The
        # two handle a resumed session differently, so the cost tests run on both.
        run: |
          version=$(python -c "import tomllib; lock = tomllib.load(open('uv.lock', 'rb')); print(next(p['version'] for p in lock['package'] if p['name'] == 'claude-agent-sdk'))")
          python -m pip install "claude-agent-sdk==$version"
          python -m pytest -q tests/harness/test_claude_cost.py
      - name: Run the Claude Agent SDK reference on the SDK it pins
        # Its real-CLI test runs the CLI bundled in the SDK the example pins, and refuses any other.
        run: |
          version=$(sed -n 's/^claude-agent-sdk==//p' examples/harness/claude_agent_sdk_support/requirements.txt)
          python -m pip install "claude-agent-sdk==$version" 'traceai-claude-agent-sdk==0.1.2'
          python -m pytest -q tests/harness/test_claude_agent_sdk_reference.py
      - name: Run the measuring suite with the SDK instrumentors
        # ALK's own environment has no traceAI instrumentors, so these tests would skip. They
        # run here with them, on the OpenTelemetry the lock pins (1.39.1): an older SDK flushes
        # differently, and measuring has to work on it.
        run: >-
          python -m pip install
          'traceai-openai==0.1.15' 'traceai-anthropic==0.1.14' 'traceai-langchain==0.2.1'
          'openai==2.54.0' 'anthropic==2.8.0' 'langchain-openai==1.8.0' 'langfuse==4.15.6'
          'opentelemetry-api==1.39.1' 'opentelemetry-sdk==1.39.1'
          'opentelemetry-exporter-otlp-proto-http==1.39.1' 'opentelemetry-proto==1.39.1'
          && python -m pytest -q tests/harness/test_simulation_measure.py
      - name: Run the tracing cleaner on the locked fi-instrumentation-otel
        # The hosted image installs what uv.lock pins (fi-instrumentation-otel 1.0.0, with the
        # traceAI instrumentors of the hosted-tracing extra), not the newest release the steps
        # above resolve. The cleaner masks secrets in what is exported, so its tests run on that
        # install as well.
        run: >-
          python -m pip install uv
          && uv export --frozen --extra hosted-tracing --no-hashes --no-emit-project
          --output-file locked-requirements.txt
          && python -m venv .locked-venv
          && .locked-venv/bin/python -m pip install -r locked-requirements.txt
          && .locked-venv/bin/python -m pip install --no-deps .
          && .locked-venv/bin/python -m pytest -q tests/harness/test_observability.py
