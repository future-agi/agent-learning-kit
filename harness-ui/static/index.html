  const passed = data.filter(run => run.passed).length;
  const summary = pane(body, "Results", `${passed} of ${data.length} passed`);
  const filters = el("div", "chips-row");
  for (const key of ["all", "passed", "failed"]) {
    const button = el("button", "tag " + (key === "failed" ? "fail" : key === "passed" ? "pass" : "soft") + (runsFilter === key ? "" : " off"), key);
    button.onclick = () => { runsFilter = key; loadTab(); };
    filters.appendChild(button);
  }
  summary.appendChild(filters);

  const shown = data.filter(run => runsFilter === "all" || (runsFilter === "passed") === !!run.passed);
  if (!shown.length) summary.appendChild(el("p", "empty", `no ${runsFilter} runs`));

  for (const raw of shown) {
    const run = normalizeRun(raw);
    const bits = [
      el("span", "tag " + (run.passed ? "pass" : "fail"), run.passed ? "pass" : "fail"),
      el("span", "title", run.scenario),
      el("span", "spacer"),
      el("span", "meta", `${run.met}/${run.of} settled by code`
        + (run.judged.length ? ` · ${run.judged.length} judged` : "")
        + (run.live ? " · live call" : run.turns ? ` · ${run.turns} turns` : "")),
    ];
    const card = xcard(body, bits, !run.passed || shown.length === 1);

    if (run.instruction) field(card, "the caller was told", el("blockquote", "", run.instruction));

    const checks = el("ul", "checks");
    for (const check of run.checks) {
      const item = el("li", check.passed || check.broken ? "" : "failed");
      item.appendChild(el("span", "cbox" + (check.broken ? " hmm" : check.passed ? "" : " no"),
        check.broken ? "!" : check.passed ? "✓" : "✗"));
      if (check.kind) item.appendChild(el("span", "kind", check.kind));
      const claim = el("span", "claim", check.name);
      /* A failure needs its reason. So does an eval that passed: the whole point of running the
         claim through a named eval is that somebody can read what it decided and why. */
      if (check.why && (!check.passed || check.by)) claim.appendChild(el("span", "why", check.why));
      if (check.by) claim.appendChild(el("span", "why decided-by", "decided by " + check.by));
      item.appendChild(claim);
      checks.appendChild(item);
    }
    for (const name of run.judged) {
      const item = el("li");
      item.appendChild(el("span", "cbox hmm", "?"));
      item.appendChild(el("span", "kind", "judged"));
      item.appendChild(el("span", "claim", `${name} — not settled by code`));
      checks.appendChild(item);
    }
    field(card, "the sub-goals", checks);

    for (const problem of run.problems) card.appendChild(el("div", "problem", problem));

    if (run.calls.length) field(card, "what the agent actually did", callsNode(run.calls));
    if (run.actions) field(card, "what the agent actually did", codeBlock(run.actions, { wrap: true }));
    if (run.transcript) field(card, "the conversation", transcriptNode(run.transcript));
  }
}

/* ---------------- the stream ---------------- */

/* Who is speaking. "harness" is what the code calls this thing, not what it should be called to
   somebody using it. General on purpose until it is named properly: one place to change. */
const SPEAKER = "tester";

function bubbleYou(text) {
  const msg = el("div", "msg you");
  msg.appendChild(el("div", "who", "you"));
  msg.appendChild(el("div", "bubble", text));
  $("thread").appendChild(msg);
}

function newHarnessMsg() {
  const msg = el("div", "msg");
  msg.appendChild(el("div", "who", SPEAKER));
  $("thread").appendChild(msg);
  return msg;
}

/* Something has to appear the instant you press send. The first token can be twenty seconds
   away while a stage reads a repository, and an empty screen in that gap reads as broken. */
function newThinking(msg, label) {
  const strip = el("div", "thinking");
  const dots = el("span", "dots");
  dots.appendChild(el("i")); dots.appendChild(el("i")); dots.appendChild(el("i"));
  strip.appendChild(dots);
  strip.appendChild(el("span", "what", label));
  const clock = el("span", "elapsed", "0s");
  strip.appendChild(clock);
  msg.appendChild(strip);
  const started = Date.now();
  const tick = setInterval(() => {
    clock.textContent = Math.round((Date.now() - started) / 1000) + "s";
  }, 1000);
  return {
    node: strip,
    say(text) { strip.querySelector(".what").textContent = text; },
    stop() { clearInterval(tick); strip.remove(); },
  };
}

function scrollDown() { const t = $("thread"); t.scrollTop = t.scrollHeight; }

async function streamFrom(url, body) {
  sending = true; $("send").disabled = true; setSending(true);
  $("stop").hidden = false;
  const msg = newHarnessMsg();
  const thinking = newThinking(msg, url.endsWith("/run") ? "running the scenarios" : "thinking");
  let prose = null;      // current text paragraph
  let work = null;       // current work strip
  let openRow = null;    // tool row awaiting its result

  const ensureWork = () => { if (!work) { work = el("div", "work"); msg.appendChild(work); } return work; };

  const handle = (event) => {
    if (event.kind === "tool") {
      thinking.say((event.detail || {}).label || event.tool);
    } else if (event.kind === "exchange") {
      thinking.say("the conversation is running");
    } else if (event.kind === "result_card") {
      thinking.say("grading");
    } else if (event.kind === "text" || event.kind === "result") {
      thinking.say("working");
    }
    if (thinking.node.parentNode) msg.appendChild(thinking.node);  // keep it last

    if (event.kind === "text") {
      if (!prose) { prose = el("p", "prose", ""); prose.dataset.raw = ""; msg.appendChild(prose); }
      prose.dataset.raw += event.text;
      prose.textContent = prose.dataset.raw;
      work = null; openRow = null;
    } else if (event.kind === "tool") {
      const detail = event.detail || {};
      const row = el("div", "row busy");
      row.appendChild(el("span", "mark", "◌"));
      row.appendChild(el("span", "what", detail.label || event.tool));
      if (detail.target) row.appendChild(el("span", "said", detail.target));
      ensureWork().appendChild(row);
      openRow = row; prose = null;
    } else if (event.kind === "result") {
      const failed = event.detail && event.detail.is_error;
      const row = openRow || (() => { const r = el("div", "row"); r.appendChild(el("span", "mark")); r.appendChild(el("span", "said")); ensureWork().appendChild(r); return r; })();
      row.classList.remove("busy");
      row.classList.add(failed ? "refused" : "ok");
      row.querySelector(".mark").textContent = failed ? "✗" : "✓";
      /* The headline on the row, the rest folded underneath. A result like check_world says
         "20/25 probes passed" and then names all five failures; showing only the first line
         hides the only part that tells you what to do about it. */
      const lines = (event.text || "").split("\n");
      row.appendChild(el("span", "said", " " + lines[0].slice(0, 160)));
      const rest = lines.slice(1).filter(line => line.trim()).join("\n");
      if (rest) {
        const more = el("details", "more");
        more.appendChild(el("summary", "", `${lines.length - 1} more lines`));
        more.appendChild(el("pre", "", rest));
        if (failed || /\bfail|probe|not saved|not kept|refused\b/i.test(event.text || "")) {
          more.open = true;   // anything that went wrong is open by default
        }
        row.parentNode.insertBefore(more, row.nextSibling);
      }
      openRow = null;
    } else if (event.kind === "exchange") {
      const speaker = (event.detail || {}).speaker || "";
      const line = el("p", "exchange");
      line.appendChild(el("span", "lbl", speaker));
      line.appendChild(document.createTextNode(event.text));
      msg.appendChild(line);
      prose = null; work = null;
    } else if (event.kind === "result_card") {
      const detail = event.detail || {};
      const line = el("p", "verdict-line " + (detail.passed ? "pass" : "fail"),
        `${detail.passed ? "✓" : "✗"} ${detail.scenario} · ${detail.met}/${detail.of} checkpoints`);
      msg.appendChild(line);
      prose = null; work = null;
    } else if (event.kind === "artifact") {
      // Something landed on disk: the pane on the right is now stale.
      loadTab();
    } else if (event.kind === "done") {
      const detail = event.detail || {};
      if (detail.error) msg.appendChild(el("div", "error-line", detail.error));
      /* The turn is over: promote every streamed paragraph from plain text to markdown. */
      for (const paragraph of msg.querySelectorAll(".prose:not(.md)")) {
        if (paragraph.dataset.raw && /[*#`]|^\s*[-*\d]/m.test(paragraph.dataset.raw)) {
          paragraph.replaceWith(renderMd(paragraph.dataset.raw));
        }
      }
      prose = null; work = null; openRow = null;
    } else if (event.kind === "status") {
      status = event.detail || status;
      renderAll();
    }
    scrollDown();
  };

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!response.ok) {
      const why = await response.json().catch(() => ({}));
      msg.appendChild(el("div", "error-line", why.error || `request failed (${response.status})`));
    } else {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const chunk = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
          if (chunk.startsWith("data: ")) {
            try { handle(JSON.parse(chunk.slice(6))); } catch (e) { /* partial */ }
          }
        }
      }
    }
  } catch (failed) {
    msg.appendChild(el("div", "error-line", `lost the server: ${failed.message}`));
  }
  thinking.stop();
  $("stop").hidden = true;
  sending = false; $("send").disabled = false; setSending(false);
  $("input").focus();
  scrollDown();
}

function send(text) {
  if (sending) return;
  const trimmed = text.trim();
  if (trimmed) bubbleYou(trimmed);
  streamFrom("/api/say", { text: trimmed });
}

function runScenarios(only) {
  if (sending) return;
  bubbleYou(only ? `run ${only}` : "run the scenarios");
  setTab("runs");
  streamFrom("/api/run", { text: only });
}

/* ---------------- wiring ---------------- */

$("new-session").onclick = () => newSession();
$("del-session").onclick = () => deleteSession();
$("send").onclick = () => { const box = $("input"); send(box.value); box.value = ""; };
function setSending(on) { $("send").textContent = on ? "…" : "Send"; }

$("stop").onclick = async () => {
  $("stop").disabled = true;
  await fetch("/api/stop", { method: "POST" }).catch(() => {});
  $("stop").disabled = false;
};
$("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    const box = $("input"); send(box.value); box.value = "";
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "/" && document.activeElement !== $("input") &&
      !/^(input|textarea|select)$/i.test(document.activeElement.tagName)) {
    event.preventDefault();
    $("input").focus();
  }
});

async function waitWhileBusy() {
  /* A refresh during a long stage must not look idle, and must not start anything: an empty
     message means "move to the next stage", so auto-sending one here would quietly kick off
     work nobody asked for and reject whatever gets typed next. */
  const msg = newHarnessMsg();
  const thinking = newThinking(msg, `still working on the ${status.stage} stage`);
  sending = true; $("send").disabled = true; setSending(true);
  $("stop").hidden = false;
  for (;;) {
    await new Promise(r => setTimeout(r, 1500));
    status = await fetch("/api/status").then(r => r.json()).catch(() => status);
    if (!status.busy) break;
  }
  thinking.stop(); msg.remove();
  $("stop").hidden = true;
  sending = false; $("send").disabled = false; setSending(false);
  renderAll();
}

(async function boot() {
  status = await fetch("/api/status").then(r => r.json());
  // A link to a run opens that run. Read before the first render, so arriving at one does not
  // flash the last tab this browser happened to be on.
  readHash();
  // The conversation is read back from the session's folder, so refreshing shows what was
  // already said rather than an empty page with a half-filled workspace beside it.
  await restore();
  renderAll();
  window.addEventListener("hashchange", () => { if (readHash()) { renderTabs(); loadTab(); } });
  if (status.busy) { await waitWhileBusy(); return; }
  // Nothing is sent on load. Reloading must not advance a stage nobody asked to advance, and
  // must not spend a model call to be greeted.
  if (!status.session) {
    const msg = newHarnessMsg();
    msg.appendChild(el("p", "prose",
      "No session yet. Press \u201c+ new\u201d to start one, then tell me which agent to test and where its code lives."));
  } else if (!(status.have || {}).contract && !(await fetch("/api/history").then(r => r.json())).messages.length) {
    const msg = newHarnessMsg();
    msg.appendChild(el("p", "prose",
      "Which agent would you like to test? Tell me where its code lives."));
  }
})();
</script>
</body>
