# The app and the returns ledger its workers call, as two services.
services:
  agent:
    build: .
    command: ["python", "agent.py"]
    environment:
      PORT: "8080"
    depends_on:
      - tools-api
  tools-api:
    build: ../../returns_multi_agent
    command: ["python", "ledger.py", "--port", "8080"]
