# The returns desk with the Refund worker as a service of its own, so a harness can stop that worker alone. The
# contract declares it with `process: refund-worker`.
services:
  agent:
    build: .
    command: ["python", "agent.py"]
    environment:
      PORT: "8080"
      REFUND_WORKER_URL: "http://refund-worker:8081"
    depends_on:
      - tools-api
      - refund-worker
  refund-worker:
    build: .
    command: ["python", "worker_service.py"]
    environment:
      PORT: "8081"
    depends_on:
      - tools-api
  tools-api:
    build: .
    command: ["python", "ledger.py", "--port", "8080"]
