[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Standalone voice-agent demo harness for Agent Learning Kit simulations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-learning-kit[livekit]",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[tool.uv.sources]
agent-learning-kit = { path = "..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
