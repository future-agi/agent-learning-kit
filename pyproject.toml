[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-learning-kit"
version = "0.1.0"
description = "Unified Future AGI SDK for agent learning workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Future AGI", email = "hello@futureagi.io" }]
keywords = [
  "ai-agents",
  "agent-testing",
  "agent-simulation",
  "agent-evaluation",
  "agent-optimization",
  "red-teaming",
  "future-agi",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fi-instrumentation-otel>=0.1.16",
  "gepa>=0.0.17",
  "httpx>=0.24.0",
  "jsonschema>=4.25.1,<5",
  "levenshtein>=0.25.0",
  "litellm>=1.80.0,<2",
  "nltk>=3.9.0",
  "numpy>=1.26.4",
  "openai>=1.109.1,<2",
  "opentelemetry-api>=1.39.1,<2",
  "opentelemetry-exporter-otlp>=1.39.1,<2",
  "opentelemetry-sdk>=1.39.1,<2",
  "optuna>=3.6.1",
  "pandas>=2.0.0",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "requests>=2.32.5,<3",
  "requests-futures>=1.0.0",
  "rich>=13.0.0",
  "rouge-score>=0.1.2",
  "typer>=0.9.0,<1.0.0",
]

[project.optional-dependencies]
simulate = []
evaluation = []
optimize = []
livekit = ["livekit-agents[openai,silero]>=1.2"]
nli = ["transformers>=5.2.0,<6", "torch>=2.10.0,<3"]
embeddings = ["sentence-transformers>=5.2.3,<6"]
feedback = ["chromadb>=0.4.0"]
trinity = [
  "livekit-agents[openai,silero]>=1.2",
]
all = [
  "chromadb>=0.4.0",
  "livekit-agents[openai,silero]>=1.2",
  "sentence-transformers>=5.2.3,<6",
  "torch>=2.10.0,<3",
  "transformers>=5.2.0,<6",
]

[project.scripts]
agent-learn = "agent_learning.cli:main"

[project.urls]
Homepage = "https://futureagi.com"
Documentation = "https://docs.futureagi.com"
Repository = "https://github.com/future-agi/agent-learning-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_learning", "src/fi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
