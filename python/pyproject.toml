[project]
name = "agent-learning-kit-legacy-evaluation-source"
version = "1.1.0"
description = "Legacy evaluation source moved into agent-learning-kit; do not publish as ai-evaluation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Future AGI", email = "no-reply@futureagi.com"}]

dependencies = [
]

[project.optional-dependencies]
nli = []
embeddings = []
feedback = []
temporal = []
celery = []
ray = []
all = []

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "transformers>=5.2.0,<6",
    "sentence-transformers>=5.2.3,<6",
    "torch>=2.10.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:Field name.*shadows an attribute:UserWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legacy_evaluation_source_marker"]
